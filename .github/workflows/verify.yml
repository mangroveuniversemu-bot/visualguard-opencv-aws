name: verify

on:
  push:
    branches:
      - codex/witness-revocation-epoch-20261013
      - claude/practical-ride-st6n28
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vision.txt
      - name: Install pinned runtime and test tools
        run: python -m pip install -r requirements-vision.txt pytest==9.0.2 ruff==0.14.13
      - name: Verify demo evidence contract
        run: python ops/verify_demo_evidence_contract.py
      - name: Verify credential-safe capture packet
        run: python ops/verify_demo_capture_packet.py
      - name: Verify deterministic local demo storyboard
        run: python ops/render_demo_storyboard.py --check
      - name: Verify judge evidence index
        run: python ops/verify_judge_evidence_index.py
      - name: Verify current deployment state
        run: python ops/verify_deployment_state.py
      - name: Check formatting and lint
        run: |
          ruff format --check ops/verify_deployment_state.py tests/test_deployment_state.py ops/verify_judge_evidence_index.py tests/test_judge_evidence_index.py ops/render_demo_storyboard.py tests/test_demo_storyboard.py ops/verify_demo_capture_packet.py ops/verify_demo_evidence_contract.py ops/verify_final_demo_video_evidence.py tests/test_demo_capture_packet.py tests/test_demo_evidence_contract.py tests/test_final_demo_video_evidence.py vision/scene_analysis.py vision/synthetic_scenes.py ops/evaluate_scene_pipeline.py ops/smoke_test_endpoint.py service/app.py service/lambda_handler.py tests/test_scene_analysis.py tests/test_service.py ops/aws_lambda_deploy.py tests/test_aws_lambda_deploy.py
          ruff check ops/verify_deployment_state.py tests/test_deployment_state.py ops/verify_judge_evidence_index.py tests/test_judge_evidence_index.py ops/render_demo_storyboard.py tests/test_demo_storyboard.py ops/verify_demo_capture_packet.py ops/verify_demo_evidence_contract.py ops/verify_final_demo_video_evidence.py tests/test_demo_capture_packet.py tests/test_demo_evidence_contract.py tests/test_final_demo_video_evidence.py vision/scene_analysis.py vision/synthetic_scenes.py ops/evaluate_scene_pipeline.py ops/smoke_test_endpoint.py service/app.py service/lambda_handler.py tests/test_scene_analysis.py tests/test_service.py ops/aws_lambda_deploy.py tests/test_aws_lambda_deploy.py
      - name: Run test suite
        run: python -m pytest -q

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-vision.txt
      - name: Install pinned runtime for the smoke client
        run: python -m pip install -r requirements-vision.txt
      - name: Build HTTP and Lambda images
        run: |
          docker build --target http -t visualguard:http-ci .
          docker build --target lambda -t visualguard:lambda-ci .
          docker image inspect visualguard:http-ci --format '{{.Id}}'
          docker image inspect visualguard:lambda-ci --format '{{.Id}}'
      - name: Run read-only container and smoke test the endpoint
        run: |
          docker run -d --name vg --read-only --tmpfs /tmp -p 8080:8080 visualguard:http-ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          python ops/smoke_test_endpoint.py --base-url http://127.0.0.1:8080
          docker logs vg
