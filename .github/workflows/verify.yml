name: verify

on:
  push:
    branches:
      - codex/witness-revocation-epoch-20261013
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned runtime and test tools
        run: python -m pip install -r requirements-vision.txt pytest==9.0.2 ruff==0.14.13
      - name: Verify demo evidence contract
        run: python ops/verify_demo_evidence_contract.py
      - name: Check formatting and lint
        run: |
          ruff format --check ops/verify_demo_evidence_contract.py tests/test_demo_evidence_contract.py
          ruff check ops/verify_demo_evidence_contract.py tests/test_demo_evidence_contract.py
      - name: Run test suite
        run: python -m pytest -q
